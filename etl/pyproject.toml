[project]
name = "sshex"
version = "0.1.0"
description = "黑格尔语料 ETL：从 TEI 生成离线应用用的 SQLite 库"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sshex = "sshex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sshex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
