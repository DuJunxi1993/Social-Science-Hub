[package]
name = "social-science-hub"
version = "0.1.0"
description = "中文社科研读平台 · 离线本地应用"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sshub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "social-science-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite 静态编进来 —— 用户机上不需要装任何东西。
rusqlite = { version = "0.43", features = ["bundled"] }
# 规则表里有负向断言（`(?<![sc])c(?= [aou])`），标准 regex 不支持回头看。
fancy-regex = "0.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
